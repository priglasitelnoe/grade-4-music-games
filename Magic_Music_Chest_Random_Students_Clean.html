/* Every student chooses one independently randomized chest. */
.chests{width:min(1350px,100%);display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:clamp(5px,.85vw,12px);margin-top:14px;align-items:stretch}
.chestCard{min-height:0;padding:5px 4px 9px;border-radius:16px;overflow:hidden;transition:transform .2s,box-shadow .2s,background .2s}
.chestImg{width:min(100%,150px);aspect-ratio:1;margin:-10px auto -16px}
.chestLabel{font-size:clamp(12px,1.05vw,16px);padding:5px 6px;max-width:150px}
.chestCard.revealed{background:linear-gradient(#6b4797aa,#213c61bc);border-color:#b6ffdb;box-shadow:inset 0 0 15px #f6f2b833;cursor:default;opacity:.9}
.chestCard.revealed .chestImg{filter:drop-shadow(0 0 8px #ffed91)}
.chestCard.revealed .chestLabel{color:#fff9bf;background:#426340ce;border-color:#ccffb7}
.chestCard.revealed .top{transform:translateY(-25%) rotate(-9deg)}
.chestCard:not(.revealed):hover{transform:translateY(-4px) scale(1.018)}
.chestCard.revealed:hover{transform:none}
.chestCard:disabled{cursor:default}
.legend{margin-top:8px;display:flex;justify-content:center;flex-wrap:wrap;gap:5px;color:#fff2d0;font-weight:700;font-size:13px}
.legend span{background:#351344c9;border:1px solid #ffd99077;border-radius:40px;padding:5px 10px}

const clamp=(v,min,max)=>Math.max(min,Math.min(max,Math.trunc(Number(v)||min)));
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function balanced(st,gr){const base=Math.floor(st/gr),extra=st%gr,caps=Array(gr).fill(base),ids=shuffle(Array.from({length:gr},(_,i)=>i));for(let i=0;i<extra;i++)caps[ids[i]]++;return caps}
function updatePreview(){const st=clamp(students.value,1,100),gr=clamp(groups.value,1,100);if(gr>st){preview.textContent='Please choose no more groups than students.';return}preview.textContent=''}
function start(){let st=clamp(students.value,1,100),gr=clamp(groups.value,1,100);students.value=st;groups.value=gr;if(gr>st){preview.textContent='Number of groups cannot exceed number of students.';groups.focus();return}total=st;n=gr;quotas=balanced(st,gr);counts=Array(n).fill(0);assignments=shuffle(quotas.flatMap((q,i)=>Array(q).fill(i)));opened=Array(total).fill(false);history=[];locked=false;panel.classList.add('hidden');area.classList.remove('hidden');complete.classList.add('hidden');chests.classList.remove('hidden');$('#instructions').classList.remove('hidden');$('#legend').classList.remove('hidden');render()}
function tone(freq,duration,type='sine',vol=.12,delay=0){if(!sound)return;try{audio ||=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let osc=audio.createOscillator(),gain=audio.createGain(),now=audio.currentTime+delay;osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(vol,now+.015);gain.gain.exponentialRampToValueAtTime(.0001,now+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(now);osc.stop(now+duration+.02)}catch(e){}}
function magicSound(){[523.25,659.25,783.99,1046.5].forEach((x,i)=>tone(x,.38,'sine',.10,i*.11))}
function render(){let done=history.length;turn.textContent=done===total?`All ${total} students assigned ✓`:`Student ${done+1} of ${total} · ${done}/${total} assigned`;const cols=total<=3?total:total<=8?4:total<=24?5:total<=36?6:total<=64?8:10;chests.style.setProperty('--cols',cols);chests.innerHTML='';for(let i=0;i<total;i++){let revealed=opened[i],g=assignments[i],b=document.createElement('button');b.type='button';b.className='chestCard'+(revealed?' revealed':'');b.disabled=revealed;b.setAttribute('aria-label',revealed?`Chest ${i+1}, Group ${g+1}`:`Open chest ${i+1}`);b.innerHTML=`<span class="chestImg"><img class="bottom" src="${chestImg}" alt=""><img class="top" src="${chestImg}" alt=""></span><span class="chestLabel">${revealed?'✓ Group '+(g+1):'Chest '+(i+1)}</span>`;if(!revealed)b.addEventListener('click',()=>choose(i,b));chests.append(b)}$('#legend').innerHTML=counts.map((v,i)=>`<span>Group ${i+1}: ${v}/${quotas[i]}</span>`).join('');if(done===total)finish()}
function burst(node){const rect=node.getBoundingClientRect(),container=$('#shimmer');for(let j=0;j<22;j++){let e=document.createElement('span');e.className='particle';e.textContent=['✦','✧','♫','★'][j%4];e.style.left=(rect.left+rect.width/2)+'px';e.style.top=(rect.top+rect.height/2)+'px';const a=Math.PI*2*j/22,d=70+Math.random()*150;e.style.setProperty('--tx',Math.cos(a)*d+'px');e.style.setProperty('--ty',Math.sin(a)*d+'px');container.append(e);setTimeout(()=>e.remove(),1350)}}
function choose(i,button){if(locked||opened[i]||history.length>=total)return;locked=true;const g=assignments[i],studentNo=history.length+1;opened[i]=true;counts[g]++;history.push(i);button.classList.add('opening');magicSound();burst(button);setTimeout(()=>{$('#resultStudent').textContent=`Student ${studentNo} · Chest ${i+1}`;$('#resultName').textContent='Group '+(g+1);$('#resultInfo').textContent='🎵 '+groupName(g)+' · '+counts[g]+' of '+quotas[g]+' assigned';$('#next').textContent=history.length===total?'See all groups ✨':'Next student ✨';result.classList.add('visible');$('#next').focus()},790)}
function next(){result.classList.remove('visible');locked=false;render()}
function finish(){$('#instructions').classList.add('hidden');$('#legend').classList.add('hidden');chests.classList.add('hidden');complete.classList.remove('hidden');turn.textContent='All '+total+' students assigned ✓';$('#summary').innerHTML=quotas.map((q,i)=>`<span>Group ${i+1} · ${groupName(i)}: <b>${counts[i]}</b> students</span>`).join('')}
function undo(){if(locked||!history.length)return;let i=history.pop(),g=assignments[i];opened[i]=false;counts[g]--;complete.classList.add('hidden');chests.classList.remove('hidden');$('#instructions').classList.remove('hidden');$('#legend').classList.remove('hidden');render();tone(330,.15,'sine',.07)}
function reset(){result.classList.remove('visible');locked=false;panel.classList.remove('hidden');area.classList.add('hidden');complete.classList.add('hidden')}

})();

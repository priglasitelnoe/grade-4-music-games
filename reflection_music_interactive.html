</section><section class="result" id="result" aria-live="polite"><div style="text-align:center;font-size:clamp(17px,1.65vw,24px);font-weight:800;color:#715a9e">Choose a face to see your learning battery! 🔋</div></section>
<div class="toolbar"><button class="tool" id="reset">↻ Try again</button><button class="tool" id="sound" aria-pressed="true">♫ Sound: ON</button><button class="tool" id="fullscreen">⛶ Full screen</button></div>
</main><script>
const buttons=[...document.querySelectorAll('.choice')],result=document.getElementById('result');let sound=true,ctx;
function tone(freq,duration,delay=0){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const osc=ctx.createOscillator(),gain=ctx.createGain(),t=ctx.currentTime+delay;osc.type='sine';osc.frequency.setValueAtTime(freq,t);gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.1,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+duration+.02)}catch(e){}}
buttons.forEach(b=>b.addEventListener('click',()=>{buttons.forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b?'true':'false')});tone(520,.16);tone(790,.21,.12);const pct=Number(b.dataset.percent);result.innerHTML='<img class="battery" src="'+b.dataset.battery+'" alt="Battery '+pct+' percent"><div class="resultcopy"><strong>'+b.dataset.title+'</strong><div class="sub">'+b.dataset.desc+'</div><div class="meter"><div class="fill" style="--clr:'+b.dataset.color+'"></div></div></div>';requestAnimationFrame(()=>requestAnimationFrame(()=>{result.querySelector('.fill').style.width=pct+'%'}));}));
document.getElementById('reset').onclick=()=>{buttons.forEach(x=>{x.classList.remove('selected');x.setAttribute('aria-pressed','false')});result.innerHTML='<div style="text-align:center;font-size:clamp(17px,1.65vw,24px);font-weight:800;color:#715a9e">Choose a face to see your learning battery! 🔋</div>';tone(430,.15)};
document.getElementById('sound').onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?'♫ Sound: ON':'♫ Sound: OFF';e.currentTarget.setAttribute('aria-pressed',String(sound));if(sound)tone(700,.12)};
document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}};
</script></body></html>
